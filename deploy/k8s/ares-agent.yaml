# =============================================================================
# Ares Docker Agent on Kubernetes, with the bundled companion updater.
# =============================================================================
# One Deployment runs the agent + the updater sidecar. The agent stays
# unprivileged (outbound-only); the updater holds a ServiceAccount scoped to
# get/patch ONLY this Deployment, so on a dashboard "Update" it patches the agent
# container's image and k8s rolls it out. The shared PVC keeps the agent's
# identity across the rollout and carries the update-target handoff file.
#
#   kubectl apply -f deploy/k8s/ares-agent.yaml   (after setting ARES_TOKEN below)
#
# To opt out of auto-update: delete the ares-updater container, the ServiceAccount,
# Role and RoleBinding; update the image via your own pipeline instead.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: ares-agent
stringData:
  ARES_TOKEN: "<your-registration-token>"   # one-time token from Settings -> Agents
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ares-agent-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ares-updater
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ares-updater
rules:
  # the updater may only read and patch this one Deployment - nothing else.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["ares-agent"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ares-updater
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ares-updater
subjects:
  - kind: ServiceAccount
    name: ares-updater
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ares-agent
  labels:
    app: ares-agent
spec:
  replicas: 1
  # Recreate (not RollingUpdate): the ReadWriteOnce PVC cannot attach to two pods at once,
  # and the old pod must release the agent identity before the new one claims it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ares-agent
  template:
    metadata:
      labels:
        app: ares-agent
    spec:
      serviceAccountName: ares-updater
      # the agent runs as the non-root "ares" user (uid/gid 10001), but a PVC mounts root-owned,
      # so without this the agent cannot write /data (state + update-target) and crash-loops.
      securityContext:
        fsGroup: 10001
      containers:
        - name: ares-agent          # the patched container; ARES_UPDATE_CONTAINER matches this
          image: ghcr.io/assailai/ares-agent:3.0.0   # pinned; the updater rolls this forward
          envFrom:
            - secretRef:
                name: ares-agent
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { memory: "128Mi", cpu: "50m" }
            limits: { memory: "256Mi", cpu: "250m" }
          livenessProbe:
            exec:
              command: ["test", "-f", "/data/agent-state.json"]
            initialDelaySeconds: 60
            periodSeconds: 30
        - name: ares-updater         # companion; keeps ares-agent on the marked version
          image: ghcr.io/assailai/ares-updater:3.0.0
          env:
            - name: ARES_UPDATE_CONTAINER
              value: "ares-agent"
            # Fail-closed: verify the image signature before applying. For local/dev before
            # signing is wired, set "false"; in production set the cosign identity/issuer.
            - name: ARES_UPDATE_REQUIRE_SIGNATURE
              value: "true"
            # - name: ARES_UPDATE_COSIGN_IDENTITY
            #   value: "https://github.com/assailai/ares-agent/.github/workflows/release.yml@refs/tags/*"
            # - name: ARES_UPDATE_COSIGN_ISSUER
            #   value: "https://token.actions.githubusercontent.com"
          volumeMounts:
            - name: data
              mountPath: /data        # reads the agent's update-target.json
          resources:
            requests: { memory: "64Mi", cpu: "20m" }
            limits: { memory: "128Mi", cpu: "100m" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ares-agent-data
