# =============================================================================
# Ares Docker Agent - Docker Compose (production)
# =============================================================================
# Zero-touch: set ARES_TOKEN (a registration token from the Ares dashboard) and run.
#
#   ARES_TOKEN=ares_agt_... docker compose up -d
#   docker compose logs -f            # watch it enroll and come online
#
# Outbound-only (HTTPS + WebSocket to ares); no published ports, no extra capabilities.
# The ares-updater companion keeps the agent on the version the dashboard marks current
# (a dashboard "Update" recreates the agent on the new, signed image). Only the updater
# holds the Docker socket; the agent stays unprivileged. To opt out of auto-update, remove
# the ares-updater service.
# =============================================================================

services:
  ares-agent:
    image: ghcr.io/assailai/ares-agent:3.0.0  # pin to a version (see Settings -> Agents); avoid :latest
    container_name: ares-agent
    hostname: ares-agent
    volumes:
      - ares-agent-data:/data
    environment:
      - ARES_TOKEN=${ARES_TOKEN:?set ARES_TOKEN to a registration token from the dashboard}
      # - ARES_URL=https://api.assailai.com        # override when self-hosting
      # - ARES_NETWORKS=10.0.0.0/24,192.168.0.0/16 # override LAN auto-detection
    restart: unless-stopped

  ares-updater:
    image: ghcr.io/assailai/ares-updater:3.0.0
    container_name: ares-updater
    volumes:
      - ares-agent-data:/data:ro                  # reads the agent's update-target.json
      - /var/run/docker.sock:/var/run/docker.sock  # recreates the agent on a new version
    environment:
      # Fail-closed: verify the image signature before applying. Set false ONLY for local
      # dev until image signing is wired; in production set the cosign identity/issuer instead.
      - ARES_UPDATE_REQUIRE_SIGNATURE=true
      # - ARES_UPDATE_COSIGN_IDENTITY=https://github.com/assailai/ares-agent/.github/workflows/release.yml@refs/tags/*
      # - ARES_UPDATE_COSIGN_ISSUER=https://token.actions.githubusercontent.com
    restart: unless-stopped

volumes:
  ares-agent-data:
    driver: local
