# =============================================================================
# Ares Docker Agent - Docker Compose (Production)
# =============================================================================
#
# Usage:
#   docker compose up -d
#   docker compose logs -f
#
# To get the initial password:
#   docker compose logs ares-agent | grep "Initial Password"
#
# =============================================================================

services:
  ares-agent:
    image: assailai/ares-agent:latest
    platform: linux/amd64
    container_name: ares-agent
    hostname: ares-agent
    user: root
    ports:
      - "8443:8443"
    volumes:
      - ares-agent-data:/data
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - ARES_RUN_AS_ROOT=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://localhost:8443/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Self-update sidecar (opt-in)
  # ---------------------------------------------------------------------------
  # Performs dashboard-triggered upgrades. It holds the Docker socket so the
  # network-exposed agent never has to — a compromise of the agent (root +
  # NET_ADMIN, listening on 8443) therefore cannot reach the Docker Engine.
  # The updater has NO inbound ports and only verified, constrained behaviour:
  # it pulls a cosign-signed image BY DIGEST and recreates the agent from a
  # fixed recipe.
  #
  # If you do NOT want to expose the Docker socket, delete this service — the
  # dashboard will then show a guided manual upgrade command instead.
  ares-agent-updater:
    image: assailai/ares-agent:latest
    platform: linux/amd64
    container_name: ares-agent-updater
    hostname: ares-agent-updater
    user: root                       # required to access the Docker socket
    environment:
      - ARES_ROLE=updater            # entrypoint runs `python -m agent.updater`
      - ARES_AGENT_CONTAINER=ares-agent
      - ARES_AGENT_DATA_VOLUME=ares-agent-data
      # The single (PUBLIC) registry the updater trusts (cosign-signed releases).
      # Public so customer hosts can pull without Assail creds; signed on both
      # Docker Hub and ghcr with the same digest.
      - ARES_AGENT_REGISTRY=docker.io/assailai/ares-agent
    volumes:
      - ares-agent-data:/data        # shared: read JWT/platform_url, write lock/state
      # Docker Engine API.
      #   Linux / macOS (Docker Desktop): the unix socket below.
      #   Windows (Docker Desktop): replace with the named pipe, e.g.
      #     - "//./pipe/docker_engine://./pipe/docker_engine"
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true       # the updater never needs to escalate
    restart: unless-stopped
    depends_on:
      - ares-agent

volumes:
  ares-agent-data:
    driver: local
