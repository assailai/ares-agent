# =============================================================================
# Ares Docker Agent - Docker Compose (development / local build)
# =============================================================================
# Builds the image locally and points it at a dev ares-v2. For a local ares-v2 on
# plain http with a self-signed / no cert, set ARES_INSECURE=true.
#
#   ARES_TOKEN=ares_agt_... ARES_URL=http://host.docker.internal:8000 \
#     ARES_INSECURE=true docker compose -f docker-compose.dev.yml up --build
# =============================================================================

services:
  ares-agent:
    build: .
    container_name: ares-agent
    hostname: ares-agent
    volumes:
      - ares-agent-data:/data
    restart: unless-stopped
    # Headroom for the concurrent-connect scanner (still non-root, no added capabilities).
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      - ARES_TOKEN=${ARES_TOKEN:?set ARES_TOKEN to a registration token}
      - ARES_URL=${ARES_URL:-https://api.assailai.com}
      - ARES_INSECURE=${ARES_INSECURE:-false}
      - ARES_NETWORKS=${ARES_NETWORKS:-}
      - ARES_LOG_LEVEL=DEBUG

volumes:
  ares-agent-data:
    driver: local
