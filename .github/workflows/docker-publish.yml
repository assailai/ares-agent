name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
      id-token: write   # allow the reusable workflow to request an OIDC token for cosign
    uses: ./.github/workflows/docker-build.yml
    with:
      # Branch name (e.g. main), PR ref, short sha, and `latest` on the default branch.
      # The semver lines only fire when a human pushes a v* tag directly; auto-created
      # tags don't re-trigger this workflow, so auto-tag.yml builds those images itself.
      meta_tags: |
        type=ref,event=branch
        type=ref,event=pr
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}
        type=sha,prefix=
        type=raw,value=latest,enable={{is_default_branch}}
      push: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
